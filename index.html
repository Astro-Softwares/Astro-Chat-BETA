<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroChat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
}

:root {
    --bg: #08090d;
    --panel: #11131a;
    --panel2: #181b24;
    --border: #252936;
    --accent: #7c5cff;
    --accent2: #9b84ff;
    --text: #ffffff;
    --muted: #9297a8;
    --message: #252036;
}

body {
    margin: 0;
    font-family: Montserrat, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
}

button,
input {
    font-family: inherit;
}

button {
    cursor: pointer;
}

/* =========================
   LOGIN
========================= */

.login {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(
            circle at top,
            #21154d 0%,
            transparent 45%
        ),
        var(--bg);
    z-index: 100;
}

.login-card {
    width: 390px;
    max-width: 90%;
    padding: 35px;
    background: rgba(17, 19, 26, .96);
    border: 1px solid var(--border);
    border-radius: 22px;
    box-shadow: 0 25px 80px #0008;
}

.logo {
    text-align: center;
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 8px;
}

.logo span {
    color: var(--accent2);
}

.subtitle {
    text-align: center;
    color: var(--muted);
    margin-bottom: 30px;
}

.login input {
    width: 100%;
    padding: 14px;
    margin-bottom: 12px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: white;
    outline: none;
}

.login input:focus {
    border-color: var(--accent);
}

.primary {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 12px;
    background: var(--accent);
    color: white;
    font-weight: 700;
    font-size: 15px;
}

.primary:hover {
    background: var(--accent2);
}

.switch {
    margin-top: 18px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
}

.switch span:last-child {
    color: var(--accent2);
    cursor: pointer;
    margin-left: 5px;
}

#authMessage {
    margin-top: 15px;
    text-align: center;
    color: #ff7d7d;
    font-size: 13px;
}

/* =========================
   APP
========================= */

.app {
    display: flex;
    height: 100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 330px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
}

.sidebar-header {
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.brand {
    font-size: 22px;
    font-weight: 700;
}

.brand span {
    color: var(--accent2);
}

.logout {
    background: transparent;
    border: 0;
    color: var(--muted);
    font-size: 13px;
}

.logout:hover {
    color: white;
}

.search {
    margin: 0 15px 15px;
    padding: 12px 14px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: white;
    outline: none;
}

.search:focus {
    border-color: var(--accent);
}

.search::placeholder {
    color: #686d7c;
}

.chat-list {
    flex: 1;
    overflow-y: auto;
}

.chat {
    padding: 14px 18px;
    display: flex;
    gap: 12px;
    align-items: center;
    cursor: pointer;
    border-left: 3px solid transparent;
}

.chat:hover {
    background: #ffffff08;
}

.chat.active {
    background: #7c5cff14;
    border-left-color: var(--accent);
}

.avatar {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: linear-gradient(
        135deg,
        var(--accent),
        #3b2c82
    );
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    flex-shrink: 0;
}

.chat-info {
    min-width: 0;
}

.chat-name {
    font-weight: 600;
}

.chat-status {
    color: var(--muted);
    font-size: 12px;
    margin-top: 4px;
}

/* =========================
   MAIN CHAT
========================= */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.chat-header {
    height: 76px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 15px 22px;
    gap: 13px;
}

.header-info {
    flex: 1;
}

.header-name {
    font-weight: 700;
}

.header-status {
    color: var(--muted);
    font-size: 12px;
    margin-top: 4px;
}

/* =========================
   MESSAGES
========================= */

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.empty {
    margin: auto;
    color: var(--muted);
    text-align: center;
    line-height: 1.6;
}

.message {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 15px;
    line-height: 1.45;
    font-size: 14px;
    word-wrap: break-word;
}

.message.mine {
    align-self: flex-end;
    background: var(--accent);
    border-bottom-right-radius: 4px;
}

.message.theirs {
    align-self: flex-start;
    background: var(--message);
    border-bottom-left-radius: 4px;
}

.time {
    display: block;
    font-size: 9px;
    opacity: .65;
    margin-top: 4px;
    text-align: right;
}

/* =========================
   COMPOSER
========================= */

.composer {
    padding: 15px;
    display: flex;
    gap: 10px;
    border-top: 1px solid var(--border);
}

.composer input {
    flex: 1;
    padding: 14px 16px;
    border: 1px solid var(--border);
    background: var(--panel2);
    border-radius: 15px;
    color: white;
    outline: none;
}

.composer input:focus {
    border-color: var(--accent);
}

.composer input::placeholder {
    color: #686d7c;
}

.send {
    width: 50px;
    border: 0;
    border-radius: 15px;
    background: var(--accent);
    color: white;
    font-size: 20px;
}

.send:hover {
    background: var(--accent2);
}

.send:disabled {
    opacity: .4;
    cursor: not-allowed;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .sidebar {
        width: 100%;
    }

    .main {
        display: none;
    }

    .mobile-chat .sidebar {
        display: none;
    }

    .mobile-chat .main {
        display: flex;
    }

    .message {
        max-width: 85%;
    }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN SCREEN
========================= -->

<div class="login" id="loginScreen">

    <div class="login-card">

        <div class="logo">
            Astro<span>Chat</span>
        </div>

        <div class="subtitle">
            Simple. Fast. Real-time.
        </div>

        <input
            id="email"
            type="email"
            placeholder="Email"
            autocomplete="email"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <input
            id="username"
            type="text"
            placeholder="Username"
            maxlength="30"
            autocomplete="username"
            style="display:none"
        >

        <button
            class="primary"
            id="authButton"
        >
            Sign In
        </button>

        <div class="switch">
            <span id="switchText">
                Don't have an account?
            </span>

            <span id="switchButton">
                Create one
            </span>
        </div>

        <div id="authMessage"></div>

    </div>

</div>


<!-- =========================
     APP
========================= -->

<div
    class="app"
    id="app"
    style="display:none"
>

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-header">

            <div class="brand">
                Astro<span>Chat</span>
            </div>

            <button
                class="logout"
                id="logout"
            >
                Log out
            </button>

        </div>

        <!-- SEARCH -->

        <input
            class="search"
            id="search"
            placeholder="Search username..."
            autocomplete="off"
        >

        <!-- SEARCH RESULTS -->

        <div
            class="chat-list"
            id="chatList"
        ></div>

    </aside>


    <!-- CHAT -->

    <main class="main">

        <header class="chat-header">

            <div
                class="avatar"
                id="headerAvatar"
            >
                ?
            </div>

            <div class="header-info">

                <div
                    class="header-name"
                    id="headerName"
                >
                    Select a user
                </div>

                <div
                    class="header-status"
                    id="headerStatus"
                >
                    Search for someone's username
                </div>

            </div>

        </header>


        <!-- MESSAGES -->

        <section
            class="messages"
            id="messages"
        >

            <div class="empty">

                🔍<br>

                Search for a username to start chatting.

            </div>

        </section>


        <!-- MESSAGE INPUT -->

        <div class="composer">

            <input
                id="messageInput"
                placeholder="Type a message..."
                disabled
                autocomplete="off"
            >

            <button
                class="send"
                id="sendButton"
                disabled
            >
                ➤
            </button>

        </div>

    </main>

</div>


<script>

/* =====================================================
   SUPABASE CONFIG
   ===================================================== */

/*
    YOUR SUPABASE INFORMATION
*/

const SUPABASE_URL =
    "https://kcyoimzjmnfyqwkafgqe.supabase.co";

const SUPABASE_KEY =
    "PASTE_YOUR_PUBLISHABLE_KEY_HERE";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;
let currentProfile = null;
let selectedUser = null;
let realtimeChannel = null;
let signupMode = false;


/* =====================================================
   ELEMENTS
===================================================== */

const loginScreen =
    document.getElementById("loginScreen");

const app =
    document.getElementById("app");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const usernameInput =
    document.getElementById("username");

const authButton =
    document.getElementById("authButton");

const switchButton =
    document.getElementById("switchButton");

const switchText =
    document.getElementById("switchText");

const authMessage =
    document.getElementById("authMessage");

const chatList =
    document.getElementById("chatList");

const searchInput =
    document.getElementById("search");

const headerName =
    document.getElementById("headerName");

const headerStatus =
    document.getElementById("headerStatus");

const headerAvatar =
    document.getElementById("headerAvatar");

const messages =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const logoutButton =
    document.getElementById("logout");


/* =====================================================
   LOGIN / SIGNUP SWITCH
===================================================== */

switchButton.onclick = () => {

    signupMode = !signupMode;

    usernameInput.style.display =
        signupMode
            ? "block"
            : "none";

    authButton.textContent =
        signupMode
            ? "Create Account"
            : "Sign In";

    switchText.textContent =
        signupMode
            ? "Already have an account?"
            : "Don't have an account?";

    switchButton.textContent =
        signupMode
            ? "Sign in"
            : "Create one";

    authMessage.textContent = "";

};


/* =====================================================
   AUTHENTICATION
===================================================== */

authButton.onclick = async () => {

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;

    const username =
        usernameInput.value.trim().toLowerCase();

    authMessage.textContent = "";


    if (!email || !password) {

        authMessage.textContent =
            "Enter your email and password.";

        return;
    }


    /* =========================
       SIGN UP
    ========================= */

    if (signupMode) {

        if (!username) {

            authMessage.textContent =
                "Choose a username.";

            return;
        }


        if (!/^[a-zA-Z0-9_]+$/.test(username)) {

            authMessage.textContent =
                "Username can only contain letters, numbers, and underscores.";

            return;
        }


        /*
            Check whether username already exists
        */

        const {
            data: existingUser,
            error: usernameError
        } = await supabaseClient
            .from("profiles")
            .select("id")
            .eq("username", username)
            .maybeSingle();


        if (usernameError) {

            authMessage.textContent =
                usernameError.message;

            return;
        }


        if (existingUser) {

            authMessage.textContent =
                "That username is already taken.";

            return;
        }


        /*
            Create Supabase account
        */

        const {
            data,
            error
        } = await supabaseClient.auth.signUp({
            email: email,
            password: password
        });


        if (error) {

            authMessage.textContent =
                error.message;

            return;
        }


        if (!data.user) {

            authMessage.textContent =
                "Account creation failed.";

            return;
        }


        /*
            Create profile
        */

        const {
            error: profileError
        } = await supabaseClient
            .from("profiles")
            .insert({

                id: data.user.id,

                username: username,

                display_name: username

            });


        if (profileError) {

            authMessage.textContent =
                profileError.message;

            return;
        }


        authMessage.style.color =
            "#67d78b";

        authMessage.textContent =
            "Account created! You can now sign in.";

        signupMode = false;

        usernameInput.style.display =
            "none";

        authButton.textContent =
            "Sign In";

        switchText.textContent =
            "Don't have an account?";

        switchButton.textContent =
            "Create one";

        return;
    }


    /* =========================
       SIGN IN
    ========================= */

    const {
        error
    } = await supabaseClient
        .auth
        .signInWithPassword({

            email: email,

            password: password

        });


    if (error) {

        authMessage.textContent =
            error.message;

        return;
    }

};


/* =====================================================
   START APP
===================================================== */

async function startApp() {

    const {
        data: {
            session
        }
    } =
        await supabaseClient
        .auth
        .getSession();


    if (session) {

        await loadUser(
            session.user
        );

    } else {

        showLogin();

    }

}


/* =====================================================
   AUTH STATE
===================================================== */

supabaseClient
    .auth
    .onAuthStateChange(
        async (event, session) => {

            if (session) {

                await loadUser(
                    session.user
                );

            } else {

                showLogin();

            }

        }
    );


/* =====================================================
   LOAD USER
===================================================== */

async function loadUser(user) {

    currentUser = user;


    const {
        data,
        error
    } =
        await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .single();


    if (error) {

        console.error(error);

        return;
    }


    currentProfile = data;


    loginScreen.style.display =
        "none";

    app.style.display =
        "flex";


    /*
        Don't show every user.
        Start with an empty search.
    */

    loadUsers("");

}


/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin() {

    currentUser = null;

    currentProfile = null;

    selectedUser = null;


    loginScreen.style.display =
        "flex";

    app.style.display =
        "none";


    searchInput.value =
        "";

}


/* =====================================================
   LOG OUT
===================================================== */

logoutButton.onclick =
    async () => {

        if (realtimeChannel) {

            await supabaseClient
                .removeChannel(
                    realtimeChannel
                );

            realtimeChannel = null;

        }


        await supabaseClient
            .auth
            .signOut();

    };


/* =====================================================
   SEARCH USERS
===================================================== */

async function loadUsers(search = "") {

    chatList.innerHTML = "";


    /*
        Don't show users if there
        isn't a search.
    */

    if (!search.trim()) {

        chatList.innerHTML = `

            <div style="
                padding: 35px 20px;
                text-align: center;
                color: var(--muted);
                font-size: 13px;
                line-height: 1.6;
            ">

                🔍

                <br><br>

                Search for a username
                to start chatting.

            </div>

        `;

        return;
    }


    /*
        EXACT username search
    */

    const {
        data,
        error
    } =
        await supabaseClient
        .from("profiles")
        .select("*")
        .eq(
            "username",
            search.trim().toLowerCase()
        )
        .neq(
            "id",
            currentUser.id
        )
        .limit(1);


    if (error) {

        console.error(error);

        chatList.innerHTML = `

            <div style="
                padding: 25px;
                text-align: center;
                color: #ff7d7d;
                font-size: 13px;
            ">

                Search failed.

            </div>

        `;

        return;
    }


    /*
        No user
    */

    if (!data || data.length === 0) {

        chatList.innerHTML = `

            <div style="
                padding: 30px 20px;
                text-align: center;
                color: var(--muted);
                font-size: 13px;
            ">

                No user found.

            </div>

        `;

        return;
    }


    /*
        Found user
    */

    const user =
        data[0];


    const div =
        document.createElement("div");


    div.className =
        "chat";


    div.innerHTML = `

        <div class="avatar">

            ${escapeHTML(
                user.display_name
                    .charAt(0)
                    .toUpperCase()
            )}

        </div>


        <div class="chat-info">

            <div class="chat-name">

                ${escapeHTML(
                    user.display_name
                )}

            </div>


            <div class="chat-status">

                @${escapeHTML(
                    user.username
                )}

            </div>

        </div>

    `;


    div.onclick =
        () => {

            selectUser(user);

        };


    chatList.appendChild(div);

}


/* =====================================================
   SEARCH EVENT
===================================================== */

searchInput.addEventListener(
    "input",
    () => {

        loadUsers(
            searchInput.value
        );

    }
);


/* =====================================================
   SELECT USER
===================================================== */

async function selectUser(user) {

    selectedUser = user;


    headerName.textContent =
        user.display_name;


    headerStatus.textContent =
        "@" + user.username;


    headerAvatar.textContent =
        user.display_name
            .charAt(0)
            .toUpperCase();


    messageInput.disabled =
        false;


    sendButton.disabled =
        false;


    messageInput.focus();


    await loadMessages();


    subscribeToMessages();

}


/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages() {

    if (!selectedUser) return;


    messages.innerHTML = "";


    const {
        data,
        error
    } =
        await supabaseClient
        .from("messages")
        .select("*")
        .or(

            `and(sender_id.eq.${currentUser.id},receiver_id.eq.${selectedUser.id}),and(sender_id.eq.${selectedUser.id},receiver_id.eq.${currentUser.id})`

        )
        .order(
            "created_at",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(error);

        messages.innerHTML = `

            <div class="empty">

                Could not load messages.

            </div>

        `;

        return;
    }


    if (!data || data.length === 0) {

        messages.innerHTML = `

            <div class="empty">

                No messages yet.<br>

                Say hello! 👋

            </div>

        `;

        return;
    }


    data.forEach(
        message => {

            addMessage(message);

        }
    );


    scrollMessages();

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(message) {

    const empty =
        messages.querySelector(".empty");


    if (empty) {

        empty.remove();

    }


    /*
        Prevent realtime duplicates
    */

    const existing =
        document.querySelector(
            `[data-message-id="${message.id}"]`
        );


    if (existing) return;


    const div =
        document.createElement("div");


    div.dataset.messageId =
        message.id;


    const mine =
        message.sender_id ===
        currentUser.id;


    div.className =
        "message " +
        (
            mine
                ? "mine"
                : "theirs"
        );


    const date =
        new Date(
            message.created_at
        );


    const time =
        date.toLocaleTimeString(
            [],
            {
                hour: "numeric",
                minute: "2-digit"
            }
        );


    div.innerHTML = `

        ${escapeHTML(
            message.content
        )}

        <span class="time">

            ${time}

        </span>

    `;


    messages.appendChild(div);


    scrollMessages();

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage() {

    if (!selectedUser) return;


    const content =
        messageInput.value.trim();


    if (!content) return;


    messageInput.value =
        "";


    const {
        error
    } =
        await supabaseClient
        .from("messages")
        .insert({

            sender_id:
                currentUser.id,

            receiver_id:
                selectedUser.id,

            content:
                content

        });


    if (error) {

        console.error(error);

        alert(
            "Could not send message:\n\n" +
            error.message
        );

    }

}


/* =====================================================
   SEND BUTTON
===================================================== */

sendButton.onclick =
    sendMessage;


/* =====================================================
   ENTER TO SEND
===================================================== */

messageInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   REALTIME MESSAGES
===================================================== */

function subscribeToMessages() {

    if (realtimeChannel) {

        supabaseClient
            .removeChannel(
                realtimeChannel
            );

    }


    realtimeChannel =
        supabaseClient
        .channel(
            "chat-" +
            currentUser.id +
            "-" +
            selectedUser.id
        )
        .on(

            "postgres_changes",

            {

                event: "INSERT",

                schema: "public",

                table: "messages"

            },

            payload => {

                const message =
                    payload.new;


                const belongsToChat =

                    (
                        message.sender_id ===
                        currentUser.id

                        &&

                        message.receiver_id ===
                        selectedUser.id
                    )

                    ||

                    (
                        message.sender_id ===
                        selectedUser.id

                        &&

                        message.receiver_id ===
                        currentUser.id
                    );


                if (
                    belongsToChat
                ) {

                    addMessage(
                        message
                    );

                }

            }

        )
        .subscribe();

}

function scrollMessages() {

    messages.scrollTop =

        document.createElement(
