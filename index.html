<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroChat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');

* {
  box-sizing: border-box;
}

:root {
  --bg: #08090d;
  --panel: #11131a;
  --panel2: #181b24;
  --border: #252936;
  --accent: #7c5cff;
  --accent2: #9b84ff;
  --text: #ffffff;
  --muted: #9297a8;
  --message: #252036;
}

body {
  margin: 0;
  font-family: Montserrat, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
}

button,
input {
  font-family: inherit;
}

button {
  cursor: pointer;
}

/* LOGIN */

.login {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at top, #21154d 0%, transparent 45%),
    var(--bg);
  z-index: 100;
}

.login-card {
  width: 390px;
  max-width: 90%;
  padding: 35px;
  background: rgba(17, 19, 26, 0.96);
  border: 1px solid var(--border);
  border-radius: 22px;
  box-shadow: 0 25px 80px #0008;
}

.logo {
  text-align: center;
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 8px;
}

.logo span {
  color: var(--accent2);
}

.subtitle {
  text-align: center;
  color: var(--muted);
  margin-bottom: 30px;
}

.login input {
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: #fff;
  outline: none;
}

.login input:focus {
  border-color: var(--accent);
}

.primary {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 12px;
  background: var(--accent);
  color: #fff;
  font-weight: 700;
  font-size: 15px;
}

.primary:hover {
  background: var(--accent2);
}

.switch {
  margin-top: 18px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}

.switch span:last-child {
  color: var(--accent2);
  cursor: pointer;
  margin-left: 5px;
}

#authMessage {
  margin-top: 15px;
  text-align: center;
  color: #ff7d7d;
  font-size: 13px;
}

/* APP */

.app {
  display: flex;
  height: 100vh;
}

.sidebar {
  width: 330px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}

.sidebar-header {
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  font-size: 22px;
  font-weight: 700;
}

.brand span {
  color: var(--accent2);
}

.logout {
  background: transparent;
  border: 0;
  color: var(--muted);
  font-size: 13px;
}

.logout:hover {
  color: #fff;
}

.search {
  margin: 0 15px 15px;
  padding: 12px 14px;
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: #fff;
  outline: none;
}

.search:focus {
  border-color: var(--accent);
}

.search::placeholder {
  color: #686d7c;
}

.chat-list {
  flex: 1;
  overflow-y: auto;
}

.chat {
  padding: 14px 18px;
  display: flex;
  gap: 12px;
  align-items: center;
  cursor: pointer;
  border-left: 3px solid transparent;
}

.chat:hover {
  background: #ffffff08;
}

.chat.active {
  background: #7c5cff14;
  border-left-color: var(--accent);
}

.avatar {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #3b2c82);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  flex-shrink: 0;
}

.chat-info {
  min-width: 0;
}

.chat-name {
  font-weight: 600;
}

.chat-status {
  color: var(--muted);
  font-size: 12px;
  margin-top: 4px;
}

/* MAIN CHAT */

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.chat-header {
  height: 76px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 15px 22px;
  gap: 13px;
}

.header-info {
  flex: 1;
}

.header-name {
  font-weight: 700;
}

.header-status {
  color: var(--muted);
  font-size: 12px;
  margin-top: 4px;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 25px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.empty {
  margin: auto;
  color: var(--muted);
  text-align: center;
  line-height: 1.6;
}

.message {
  max-width: 70%;
  padding: 10px 14px;
  border-radius: 15px;
  line-height: 1.45;
  font-size: 14px;
  word-wrap: break-word;
}

.message.mine {
  align-self: flex-end;
  background: var(--accent);
  border-bottom-right-radius: 4px;
}

.message.theirs {
  align-self: flex-start;
  background: var(--message);
  border-bottom-left-radius: 4px;
}

.time {
  display: block;
  font-size: 9px;
  opacity: 0.65;
  margin-top: 4px;
  text-align: right;
}

/* COMPOSER */

.composer {
  padding: 15px;
  display: flex;
  gap: 10px;
  border-top: 1px solid var(--border);
}

.composer input {
  flex: 1;
  padding: 14px 16px;
  border: 1px solid var(--border);
  background: var(--panel2);
  border-radius: 15px;
  color: #fff;
  outline: none;
}

.composer input:focus {
  border-color: var(--accent);
}

.composer input::placeholder {
  color: #686d7c;
}

.send {
  width: 50px;
  border: 0;
  border-radius: 15px;
  background: var(--accent);
  color: #fff;
  font-size: 20px;
}

.send:hover {
  background: var(--accent2);
}

.send:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* MOBILE */

@media (max-width: 700px) {
  .sidebar {
    width: 100%;
  }

  .main {
    display: none;
  }

  .mobile-chat .sidebar {
    display: none;
  }

  .mobile-chat .main {
    display: flex;
  }

  .message {
    max-width: 85%;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div class="login" id="loginScreen">

  <div class="login-card">

    <div class="logo">
      Astro<span>Chat</span>
    </div>

    <div class="subtitle">
      Simple. Fast. Real-time.
    </div>

    <input
      id="email"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <input
      id="username"
      type="text"
      placeholder="Username"
      maxlength="30"
      autocomplete="username"
      style="display:none"
    >

    <button class="primary" id="authButton">
      Sign In
    </button>

    <div class="switch">
      <span id="switchText">
        Don't have an account?
      </span>

      <span id="switchButton">
        Create one
      </span>
    </div>

    <div id="authMessage"></div>

  </div>

</div>


<!-- APP -->

<div class="app" id="app" style="display:none">

  <aside class="sidebar">

    <div class="sidebar-header">

      <div class="brand">
        Astro<span>Chat</span>
      </div>

      <button class="logout" id="logout">
        Log out
      </button>

    </div>

    <input
      class="search"
      id="search"
      placeholder="Search username..."
      autocomplete="off"
    >

    <div class="chat-list" id="chatList"></div>

  </aside>


  <main class="main">

    <header class="chat-header">

      <div class="avatar" id="headerAvatar">
        ?
      </div>

      <div class="header-info">

        <div class="header-name" id="headerName">
          Select a user
        </div>

        <div class="header-status" id="headerStatus">
          Search for someone's username
        </div>

      </div>

    </header>


    <section class="messages" id="messages">

      <div class="empty">
        🔍
        <br><br>
        Search for a username to start chatting.
      </div>

    </section>


    <div class="composer">

      <input
        id="messageInput"
        placeholder="Type a message..."
        disabled
        autocomplete="off"
      >

      <button
        class="send"
        id="sendButton"
        disabled
      >
        ➤
      </button>

    </div>

  </main>

</div>
